name: OurNotes update watcher

on:
  schedule:
    - cron: "*/10 1-6 * * *"
    - cron: "0 0,7-23 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "只发送一条测试推送"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ournotes-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          PUSH_URL: ${{ secrets.PUSH_URL }}
          PUSH_TYPE: ${{ secrets.PUSH_TYPE }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          PUSH_CHAT_ID: ${{ secrets.PUSH_CHAT_ID }}
          FORCE_TEST: ${{ github.event.inputs.test }}
        run: python watch.py

      - name: Commit state
        run: |
          git config user.name "ournotes-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update OurNotes watcher state"
            git push
          fi

